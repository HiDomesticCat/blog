name: Build and deploy Hugo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 同時間只跑一個部署，避免兩次 push 互相覆蓋 docs/ 造成 git push 衝突
concurrency:
  group: deploy-pages
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.145.0'
  BASE_URL: 'https://blog.hicat0x0.uk/'
  TZ: 'Asia/Taipei'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # d2 圖表是建置期渲染的（見 scripts/render-d2.mjs）。
      # 產出的 SVG 刻意不進 git：交給 CI 產生，才能保證圖永遠跟原始碼同步，
      # 也讓你在沒有 Node 的機器上（例如 GitHub 網頁編輯器）改文章一樣能發佈。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install diagram toolchain
        run: npm ci

      - name: Render d2 diagrams
        run: npm run diagrams

      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo --minify --gc --baseURL "$BASE_URL"

      - name: Verify build output
        run: |
          test -f public/index.html      || { echo "::error::public/index.html missing"; exit 1; }
          test -f public/zh/index.html   || { echo "::error::public/zh/index.html missing"; exit 1; }
          test -f public/en/index.html   || { echo "::error::public/en/index.html missing"; exit 1; }
          test -f public/CNAME           || { echo "::error::public/CNAME missing (check static/CNAME)"; exit 1; }
          echo "CNAME -> $(cat public/CNAME)"

      - name: Publish to docs/
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r public/. docs/
          # GitHub Pages 預設會跑 Jekyll，會吃掉底線開頭的檔案；停掉它
          touch docs/.nojekyll

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Deploy site to docs [skip ci]"
            git push
          fi
