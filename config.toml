# -----------------------------------------------------------------------------
# 分類 / 網址 / 輸出
# -----------------------------------------------------------------------------
[taxonomies]
  category = "categories"
  tag      = "tags"

[permalinks]
  posts = "/posts/:slug/"

[outputs]
  # 主題沒有 home 的 JSON 模板，加了只會產生建置警告，故不啟用
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  filename   = "sitemap.xml"
  priority   = 0.5

# -----------------------------------------------------------------------------
# 隱私 / 相關文章
# -----------------------------------------------------------------------------
[privacy]
  [privacy.youtube]
    privacyEnhanced = true

[related]
  includeNewer = true
  threshold    = 80
  toLower      = true

  [[related.indices]]
    name   = "keywords"
    weight = 100

  [[related.indices]]
    name   = "tags"
    weight = 80

  [[related.indices]]
    name   = "categories"
    weight = 50

  [[related.indices]]
    name   = "date"
    weight = 10
