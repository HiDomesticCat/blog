# =============================================================================
#  hicat0x0 blog — Hugo 設定
#  主題：hugo-coder（vendored 於 themes/hugo-coder）
#  建置：GitHub Actions（.github/workflows/deploy.yml）→ docs/ → GitHub Pages
# =============================================================================

baseURL    = "https://blog.hicat0x0.uk/"
title      = "hicat0x0 blog"
theme      = "hugo-coder"

# 多語：/zh 與 /en 都帶語言前綴；根路徑 / 由 static/index.html 轉址到 /zh/
defaultContentLanguage        = "zh"
defaultContentLanguageInSubdir = true

enableEmoji    = true
enableRobotsTXT = true
enableGitInfo  = false

[pagination]
  pagerSize = 10

# -----------------------------------------------------------------------------
# Markdown / 語法標示
# -----------------------------------------------------------------------------
[markup]
  [markup.highlight]
    # noClasses = false → Chroma 輸出 CSS class，配色由主題的 _syntax.scss 提供
    # （因此不要設 style，設了也不會生效）
    noClasses      = false
    guessSyntax    = true
    lineNos        = false
    codeFences     = true
    tabWidth       = 4

  [markup.goldmark.renderer]
    unsafe = true            # 允許 Markdown 內嵌原生 HTML

  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
    ordered    = false

# -----------------------------------------------------------------------------
# 全站參數（各語言可於 [languages.*.params] 覆寫）
# -----------------------------------------------------------------------------
[params]
  author      = "hicat0x0"
  description = "資安與無線通訊研究與實作，分享技術筆記、CTF 解題與專題心得。"
  keywords    = "資訊安全,網路安全,CTF,逆向工程,無線通訊,SDR,量子計算,雲端系統,OpenStack,DevOps"
  info        = ["資訊安全", "無線通訊", "逆向工程", "量子計算", "雲端系統"]

  mainSections = ["posts"]
  avatarURL    = "images/avatar.png"
  dateFormat   = "2006年1月2日"
  since        = 2025

  colorScheme            = "auto"
  hideColorSchemeToggle  = false
  maxSeeAlsoItems        = 5
  readingTime            = true

  # 目錄（TOC）— 由 layouts/partials/toc.html 實作，hugo-coder 本身沒有這功能
  #   enableToc         全站開關；單篇可用 front matter 的 toc = true/false 覆寫
  #   tocMinHeadings    少於這個標題數就不顯示目錄
  enableToc      = true
  tocMinHeadings = 3

  # 自訂樣式與腳本 —— 路徑相對於 assets/（主題以 resources.Get 載入，不是 static/）
  customCSS = ["css/custom.css"]
  customJS  = ["js/custom.js"]

  # 社交分享卡片圖（放到 static/images/og-image.png 後再取消註解）
  # images = ["images/og-image.png"]

